<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Kewin Marchand — développeur front-end</title>
  <desc id="desc">Bannière : Kewin Marchand, front-end, React, TypeScript, design system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1060" cy="50" r="190" fill="#3b82f6" opacity="0.20" filter="url(#blur)"/>
  <circle cx="170" cy="285" r="210" fill="#14b8a6" opacity="0.16" filter="url(#blur)"/>
  <circle cx="640" cy="10" r="170" fill="#a78bfa" opacity="0.14" filter="url(#blur)"/>

  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 80h1200M0 160h1200M0 240h1200"/>
    <path d="M150 0v320M300 0v320M450 0v320M600 0v320M750 0v320M900 0v320M1050 0v320"/>
  </g>

  <rect x="80" y="128" width="7" height="72" rx="3.5" fill="url(#accent)"/>
  <text x="112" y="162" fill="#f8fafc" font-family="system-ui, 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="1">Kewin Marchand</text>
  <text x="112" y="194" fill="#93c5fd" font-family="'Cascadia Code', Consolas, monospace" font-size="18" letter-spacing="1">front-end · react · typescript · design system</text>
  <text x="112" y="250" fill="#7d8ea3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16">Vauvenargues (13)</text>

  <g font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700">
    <rect x="820" y="104" width="104" height="34" rx="17" fill="#61dafb" fill-opacity="0.12" stroke="#61dafb"/>
    <text x="872" y="126" fill="#61dafb" text-anchor="middle">React</text>
    <rect x="936" y="104" width="128" height="34" rx="17" fill="#3178c6" fill-opacity="0.14" stroke="#3178c6"/>
