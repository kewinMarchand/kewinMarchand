    <rect x="820" y="150" width="104" height="34" rx="17" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee"/>
    <text x="872" y="172" fill="#22d3ee" text-anchor="middle">Next.js</text>
    <rect x="936" y="150" width="152" height="34" rx="17" fill="#e879f9" fill-opacity="0.12" stroke="#e879f9"/>
