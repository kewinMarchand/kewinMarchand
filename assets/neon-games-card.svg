<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
  <title id="t">Arcade Collection</title>
  <desc id="d">Collection de mini-jeux jouables dans le navigateur.</desc>
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="520" fill="url(#cardbg)"/>
  <circle cx="110" cy="70" r="160" fill="#2dd4bf" opacity="0.35" filter="url(#soft)"/>
  <circle cx="710" cy="460" r="170" fill="#f472b6" opacity="0.30" filter="url(#soft)"/>

  <rect x="28" y="44" width="744" height="384" rx="18" fill="#0b1117"/>
  <path d="M28 62 a18 18 0 0 1 18 -18 h708 a18 18 0 0 1 18 18 v20 h-744 z" fill="#111a24"/>
  <line x1="28" y1="82" x2="772" y2="82" stroke="#263241"/>
  <circle cx="52" cy="63" r="6" fill="#ff5f57"/>
  <circle cx="74" cy="63" r="6" fill="#febc2e"/>
  <circle cx="96" cy="63" r="6" fill="#28c840"/>
  <rect x="122" y="51" width="320" height="24" rx="12" fill="#0b1117" stroke="#263241"/>
  <text x="282" y="67" text-anchor="middle" fill="#8b9eb3" font-family="'Cascadia Code', Consolas, monospace" font-size="12">kewinmarchand.github.io/arcade-collection</text>

  <g transform="translate(44,96)">
    <rect width="712" height="332" rx="14" fill="#0b1220"/>
    <g opacity="0.18" stroke="#7dd3fc" stroke-width="1">
      <path d="M0 280H712M0 224H712M0 168H712M0 112H712M0 56H712"/>
      <path d="M80 0V332M160 0V332M240 0V332M320 0V332M400 0V332M480 0V332M560 0V332M640 0V332"/>
    </g>

    <!-- abstract arcade composition: blocks, joystick, d-pad, coin, stars -->
    <g filter="url(#glow)">
      <!-- falling blocks / tetris-like cluster -->
      <rect x="72" y="70" width="36" height="36" rx="6" fill="#2dd4bf" opacity="0.9"/>
      <rect x="108" y="70" width="36" height="36" rx="6" fill="#2dd4bf" opacity="0.9"/>
      <rect x="108" y="106" width="36" height="36" rx="6" fill="#38bdf8" opacity="0.9"/>
      <rect x="144" y="106" width="36" height="36" rx="6" fill="#38bdf8" opacity="0.9"/>

      <rect x="520" y="46" width="30" height="30" rx="5" fill="#f472b6" opacity="0.85"/>
      <rect x="550" y="46" width="30" height="30" rx="5" fill="#f472b6" opacity="0.85"/>
      <rect x="550" y="76" width="30" height="30" rx="5" fill="#a78bfa" opacity="0.85"/>
      <rect x="580" y="76" width="30" height="30" rx="5" fill="#a78bfa" opacity="0.85"/>

      <!-- joystick -->
      <g transform="translate(170,230)">
        <ellipse cx="0" cy="34" rx="54" ry="14" fill="#111827" stroke="#334155" stroke-width="3"/>
        <rect x="-18" y="-10" width="36" height="44" rx="10" fill="#334155"/>
        <line x1="0" y1="-10" x2="0" y2="-58" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
        <circle cx="0" cy="-72" r="26" fill="url(#accent)" stroke="#e2e8f0" stroke-width="3"/>
        <circle cx="-8" cy="-80" r="7" fill="#ffffff" opacity="0.45"/>
      </g>

      <!-- d-pad -->
      <g transform="translate(360,238)" fill="#1f2937" stroke="#475569" stroke-width="3">
        <rect x="-18" y="-46" width="36" height="92" rx="8"/>
        <rect x="-46" y="-18" width="92" height="36" rx="8"/>
        <circle cx="0" cy="0" r="6" fill="#334155" stroke="none"/>
      </g>

      <!-- action buttons -->
      <g transform="translate(520,236)">
        <circle cx="-26" cy="18" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
        <circle cx="26" cy="-18" r="22" fill="#0f172a" stroke="#f472b6" stroke-width="4"/>
        <circle cx="54" cy="20" r="22" fill="#0f172a" stroke="#2dd4bf" stroke-width="4"/>
        <path d="M-34 18h16M-26 10v16" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <circle cx="26" cy="-18" r="6" fill="#f472b6"/>
        <rect x="46" y="12" width="16" height="16" rx="3" fill="none" stroke="#2dd4bf" stroke-width="3"/>
      </g>

      <!-- coin / score token -->
      <g transform="translate(356,126)">
        <circle cx="0" cy="0" r="34" fill="#fbbf24" stroke="#fde68a" stroke-width="4"/>
        <circle cx="0" cy="0" r="24" fill="none" stroke="#92400e" stroke-width="3" opacity="0.6"/>
        <text x="0" y="8" text-anchor="middle" fill="#78350f" font-family="system-ui, sans-serif" font-size="28" font-weight="800">1</text>
      </g>

      <!-- sparkles -->
      <g fill="#e0f2fe">
        <path d="M250 60l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
        <path d="M620 150l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fbcfe8"/>
        <path d="M90 170l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#99f6e4"/>
        <circle cx="470" cy="110" r="4" fill="#a78bfa"/>
        <circle cx="640" cy="250" r="3" fill="#38bdf8"/>
        <circle cx="60" cy="260" r="3" fill="#f472b6"/>
      </g>
    </g>

    <text x="356" y="314" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="4">ARCADE COLLECTION</text>
  </g>

  <text x="40" y="472" fill="#f8fafc" font-family="system-ui, 'Segoe UI', sans-serif" font-size="25" font-weight="800">Arcade Collection</text>
  <text x="40" y="498" fill="#2dd4bf" font-family="'Cascadia Code', Consolas, monospace" font-size="14">mini-jeux · navigateur</text>
  <text x="760" y="498" text-anchor="end" fill="#7d8ea3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">HTML · CSS · JS · GitHub Pages</text>
</svg>
