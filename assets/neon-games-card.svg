<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
  <title id="t">Neon Games</title>
  <desc id="d">Neon Games : neuf mini-jeux ind&#233;pendants jouables dans le navigateur.</desc>
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="800" height="520" fill="url(#cardbg)"/>
  <circle cx="110" cy="70" r="160" fill="#2dd4bf" opacity="0.35" filter="url(#soft)"/>
  <circle cx="710" cy="460" r="170" fill="#f472b6" opacity="0.30" filter="url(#soft)"/>

  <rect x="28" y="44" width="744" height="384" rx="18" fill="#0b1117"/>
  <path d="M28 62 a18 18 0 0 1 18 -18 h708 a18 18 0 0 1 18 18 v20 h-744 z" fill="#111a24"/>
  <line x1="28" y1="82" x2="772" y2="82" stroke="#263241"/>
  <circle cx="52" cy="63" r="6" fill="#ff5f57"/>
  <circle cx="74" cy="63" r="6" fill="#febc2e"/>
  <circle cx="96" cy="63" r="6" fill="#28c840"/>
  <rect x="122" y="51" width="310" height="24" rx="12" fill="#0b1117" stroke="#263241"/>
  <text x="277" y="67" text-anchor="middle" fill="#8b9eb3" font-family="'Cascadia Code', Consolas, monospace" font-size="12">kewinmarchand.github.io/neon-games</text>

  <svg x="44" y="96" width="712" height="330" viewBox="0 0 720 380" preserveAspectRatio="xMidYMid meet">
<title id="title">Neon Serpent</title>
  <desc id="desc">Un serpent néon réaliste serpente sur une grille vers une orbe rose.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10212a"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd9c0"/>
      <stop offset="0.5" stop-color="#69ffe1"/>
      <stop offset="1" stop-color="#a0ffcf"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8fff0"/>
      <stop offset="1" stop-color="#69ffe1"/>
    </linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="380" rx="24" fill="url(#bg)"/>
  <g class="stars" aria-hidden="true">
    <circle cx="18" cy="26" r="2.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="54" cy="64" r="1.4" fill="#dffcff" opacity="0.8"/>
    <circle cx="88" cy="18" r="1.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="126" cy="52" r="1.1" fill="#bff6ff" opacity="0.75"/>
    <circle cx="164" cy="86" r="2.0" fill="#ffffff" opacity="0.92"/>
    <circle cx="198" cy="24" r="1.3" fill="#dffcff" opacity="0.78"/>
    <circle cx="236" cy="60" r="2.3" fill="#ffffff" opacity="0.95"/>
    <circle cx="274" cy="14" r="1.5" fill="#bff6ff" opacity="0.8"/>
    <circle cx="312" cy="46" r="1.0" fill="#ffffff" opacity="0.7"/>
    <circle cx="348" cy="78" r="1.9" fill="#dffcff" opacity="0.88"/>
    <circle cx="386" cy="22" r="1.4" fill="#ffffff" opacity="0.82"/>
    <circle cx="424" cy="56" r="2.4" fill="#ffffff" opacity="0.96"/>
    <circle cx="462" cy="32" r="1.1" fill="#bff6ff" opacity="0.72"/>
    <circle cx="498" cy="84" r="1.7" fill="#dffcff" opacity="0.84"/>
    <circle cx="536" cy="16" r="2.1" fill="#ffffff" opacity="0.93"/>
    <circle cx="574" cy="62" r="1.3" fill="#dffcff" opacity="0.76"/>
    <circle cx="612" cy="38" r="1.6" fill="#ffffff" opacity="0.86"/>
    <circle cx="648" cy="74" r="1.1" fill="#bff6ff" opacity="0.7"/>
    <circle cx="684" cy="20" r="2.0" fill="#ffffff" opacity="0.92"/>
    <circle cx="704" cy="96" r="1.4" fill="#dffcff" opacity="0.78"/>
  </g>
  <g stroke="#69ffe1" stroke-opacity=".12" stroke-width="1">
    <path d="M110 80v260M170 80v260M230 80v260M290 80v260M350 80v260M410 80v260M470 80v260M530 80v260M590 80v260"/>
    <path d="M110 108h520M110 168h520M110 228h520M110 288h520"/>
  </g>

  <!-- Snake body: tapered segments forming a slithering S-curve -->
  <g filter="url(#g)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- tail (thin) -->
    <path d="M130 288 C160 288, 180 270, 200 250" stroke="#3fd9c0" stroke-width="6"/>
    <path d="M200 250 C220 230, 230 200, 260 188" stroke="#4ae0c8" stroke-width="8"/>
    <path d="M260 188 C290 176, 300 150, 320 138" stroke="#56e7d0" stroke-width="10"/>
    <path d="M320 138 C350 126, 370 130, 400 148" stroke="#60eed8" stroke-width="12"/>
    <path d="M400 148 C430 166, 440 195, 420 220" stroke="#69ffe1" stroke-width="13"/>
    <path d="M420 220 C400 245, 370 250, 340 238" stroke="#69ffe1" stroke-width="13"/>
    <path d="M340 238 C310 226, 300 200, 330 180" stroke="#60eed8" stroke-width="12"/>
    <path d="M330 180 C360 160, 395 162, 425 178" stroke="#56e7d0" stroke-width="11"/>
    <!-- belly highlight along the body -->
  </g>
  <!-- belly scales (small dots along the body) -->
  <g fill="#b8fff0" opacity="0.5">
    <circle cx="200" cy="250" r="2"/><circle cx="230" cy="215" r="2"/><circle cx="260" cy="188" r="2"/>
    <circle cx="290" cy="162" r="2"/><circle cx="320" cy="138" r="2"/><circle cx="350" cy="132" r="2"/>
    <circle cx="380" cy="140" r="2"/><circle cx="410" cy="158" r="2"/><circle cx="420" cy="190" r="2"/>
    <circle cx="415" cy="220" r="2"/><circle cx="395" cy="240" r="2"/><circle cx="365" cy="242" r="2"/>
    <circle cx="335" cy="230" r="2"/><circle cx="315" cy="205" r="2"/><circle cx="330" cy="180" r="2"/>
    <circle cx="360" cy="168" r="2"/><circle cx="395" cy="166" r="2"/><circle cx="425" cy="178" r="2"/>
  </g>
  <!-- head -->
  <g transform="translate(425 178)" filter="url(#g)">
    <!-- head shape -->
    <ellipse cx="0" cy="0" rx="16" ry="12" fill="url(#body)" stroke="#a0ffcf" stroke-width="1.5"/>
    <!-- belly -->
    <ellipse cx="2" cy="3" rx="9" ry="6" fill="url(#belly)" opacity="0.6"/>
    <!-- eyes -->
    <circle cx="-5" cy="-3" r="4" fill="#06231d"/>
    <circle cx="-5" cy="-3" r="2.2" fill="#ff6dbe"/>
    <circle cx="-4" cy="-4" r="0.9" fill="#fff"/>
    <circle cx="5" cy="-3" r="4" fill="#06231d"/>
    <circle cx="5" cy="-3" r="2.2" fill="#ff6dbe"/>
    <circle cx="6" cy="-4" r="0.9" fill="#fff"/>
    <!-- nostrils -->
    <circle cx="12" cy="-1" r="1.2" fill="#06231d"/>
    <circle cx="12" cy="3" r="1.2" fill="#06231d"/>
    <!-- tongue -->
    <path d="M16 1 Q26 1, 30 -3 M26 1 L30 5" stroke="#ff6dbe" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- food orb -->
  <g transform="translate(170 248)" filter="url(#g)">
    <circle cx="0" cy="0" r="13" fill="#ff6dbe"/>
    <circle cx="-4" cy="-4" r="4" fill="#ffdcec" opacity="0.8"/>
    <path d="M16 -12 a22 22 0 0 1 8 18" fill="none" stroke="#ff6dbe" stroke-width="2.5" opacity="0.7" stroke-dasharray="3 5"/>
  </g>
  <text x="360" y="55" text-anchor="middle" fill="#7af7e0" font-family="system-ui,sans-serif" font-weight="800" font-size="28" letter-spacing="6">NEON SERPENT</text>
  <text x="360" y="354" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,sans-serif" font-size="16" letter-spacing="3">GRANDIS SANS TE MORDRE</text>
  </svg>

  <text x="40" y="472" fill="#f8fafc" font-family="system-ui, 'Segoe UI', sans-serif" font-size="25" font-weight="800">Neon Games</text>
  <text x="40" y="498" fill="#f472b6" font-family="'Cascadia Code', Consolas, monospace" font-size="14">9 mini-jeux &#183; navigateur</text>
  <text x="760" y="498" text-anchor="end" fill="#7d8ea3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">HTML &#183; CSS &#183; JS &#183; GitHub Pages</text>
</svg>