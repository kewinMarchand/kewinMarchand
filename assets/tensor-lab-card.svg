<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
  <title id="t">Tensor Lab</title>
  <desc id="d">Portail d'expérimentations autour des tenseurs et du machine learning dans le navigateur.</desc>
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="520" fill="url(#cardbg)"/>
  <circle cx="110" cy="70" r="160" fill="#38bdf8" opacity="0.30" filter="url(#soft)"/>
  <circle cx="710" cy="460" r="170" fill="#818cf8" opacity="0.28" filter="url(#soft)"/>

  <rect x="28" y="44" width="744" height="384" rx="18" fill="#0b1117"/>
  <path d="M28 62 a18 18 0 0 1 18 -18 h708 a18 18 0 0 1 18 18 v20 h-744 z" fill="#111a24"/>
  <line x1="28" y1="82" x2="772" y2="82" stroke="#263241"/>
  <circle cx="52" cy="63" r="6" fill="#ff5f57"/>
  <circle cx="74" cy="63" r="6" fill="#febc2e"/>
  <circle cx="96" cy="63" r="6" fill="#28c840"/>
  <rect x="122" y="51" width="320" height="24" rx="12" fill="#0b1117" stroke="#263241"/>
  <text x="282" y="67" text-anchor="middle" fill="#8b9eb3" font-family="'Cascadia Code', Consolas, monospace" font-size="12">kewinmarchand.github.io/tensor-lab</text>

  <g transform="translate(44,96)">
    <rect width="712" height="332" rx="14" fill="#0b1220"/>

    <!-- tensor cube / matrix stack -->
    <g transform="translate(356,150)" filter="url(#glow)">
      <!-- back layer -->
      <g transform="translate(-70,-40)" opacity="0.55">
        <polygon points="0,40 80,0 160,40 80,80" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <polygon points="0,40 80,80 80,160 0,120" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
        <polygon points="80,80 160,40 160,120 80,160" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
        <g stroke="#334155" stroke-width="1">
          <line x1="20" y1="50" x2="100" y2="10"/><line x1="40" y1="60" x2="120" y2="20"/><line x1="60" y1="70" x2="140" y2="30"/>
          <line x1="20" y1="50" x2="20" y2="130"/><line x1="40" y1="60" x2="40" y2="140"/><line x1="60" y1="70" x2="60" y2="150"/>
          <line x1="100" y1="90" x2="180" y2="50"/><line x1="100" y1="110" x2="180" y2="70"/><line x1="100" y1="130" x2="180" y2="90"/>
        </g>
      </g>
      <!-- middle layer -->
      <g transform="translate(-20,-10)" opacity="0.8">
        <polygon points="0,40 80,0 160,40 80,80" fill="#1e293b" stroke="#38bdf8" stroke-width="2.2"/>
        <polygon points="0,40 80,80 80,160 0,120" fill="#111827" stroke="#38bdf8" stroke-width="2.2"/>
        <polygon points="80,80 160,40 160,120 80,160" fill="#0f172a" stroke="#818cf8" stroke-width="2.2"/>
        <g stroke="#475569" stroke-width="1">
          <line x1="20" y1="50" x2="100" y2="10"/><line x1="40" y1="60" x2="120" y2="20"/><line x1="60" y1="70" x2="140" y2="30"/>
          <line x1="20" y1="50" x2="20" y2="130"/><line x1="40" y1="60" x2="40" y2="140"/><line x1="60" y1="70" x2="60" y2="150"/>
          <line x1="100" y1="90" x2="180" y2="50"/><line x1="100" y1="110" x2="180" y2="70"/><line x1="100" y1="130" x2="180" y2="90"/>
        </g>
      </g>
      <!-- front layer -->
      <g transform="translate(30,20)">
        <polygon points="0,40 80,0 160,40 80,80" fill="#243447" stroke="#7dd3fc" stroke-width="2.5"/>
        <polygon points="0,40 80,80 80,160 0,120" fill="#162033" stroke="#38bdf8" stroke-width="2.5"/>
        <polygon points="80,80 160,40 160,120 80,160" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
        <g stroke="#64748b" stroke-width="1.2">
          <line x1="20" y1="50" x2="100" y2="10"/><line x1="40" y1="60" x2="120" y2="20"/><line x1="60" y1="70" x2="140" y2="30"/>
          <line x1="20" y1="50" x2="20" y2="130"/><line x1="40" y1="60" x2="40" y2="140"/><line x1="60" y1="70" x2="60" y2="150"/>
          <line x1="100" y1="90" x2="180" y2="50"/><line x1="100" y1="110" x2="180" y2="70"/><line x1="100" y1="130" x2="180" y2="90"/>
        </g>
        <!-- highlighted cells / activations -->
        <circle cx="40" cy="60" r="5" fill="#38bdf8"/>
        <circle cx="120" cy="20" r="5" fill="#818cf8"/>
        <circle cx="60" cy="110" r="5" fill="#22d3ee"/>
        <circle cx="140" cy="70" r="5" fill="#38bdf8"/>
        <circle cx="100" cy="130" r="5" fill="#a78bfa"/>
      </g>

      <!-- connection nodes around tensor -->
      <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.8">
        <path d="M-110 40 C-60 40, -40 60, -10 70"/>
        <path d="M230 10 C190 20, 170 40, 150 50"/>
        <path d="M210 170 C170 150, 150 140, 130 140"/>
      </g>
      <g fill="#0b1220" stroke-width="3">
        <circle cx="-110" cy="40" r="10" stroke="#38bdf8"/>
        <circle cx="230" cy="10" r="10" stroke="#818cf8"/>
        <circle cx="210" cy="170" r="10" stroke="#22d3ee"/>
        <circle cx="-110" cy="40" r="4" fill="#38bdf8" stroke="none"/>
        <circle cx="230" cy="10" r="4" fill="#818cf8" stroke="none"/>
        <circle cx="210" cy="170" r="4" fill="#22d3ee" stroke="none"/>
      </g>
    </g>

    <!-- axis labels -->
    <g font-family="'Cascadia Code', Consolas, monospace" font-size="13" fill="#94a3b8">
      <text x="110" y="286">x</text>
      <text x="604" y="286">y</text>
      <text x="356" y="70" text-anchor="middle">z · dimensions</text>
    </g>

    <text x="356" y="314" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="4">TENSOR LAB</text>
  </g>

  <text x="40" y="472" fill="#f8fafc" font-family="system-ui, 'Segoe UI', sans-serif" font-size="25" font-weight="800">Tensor Lab</text>
  <text x="40" y="498" fill="#38bdf8" font-family="'Cascadia Code', Consolas, monospace" font-size="14">expérimentations · tenseurs</text>
  <text x="760" y="498" text-anchor="end" fill="#7d8ea3" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">HTML · CSS · JS · GitHub Pages</text>
</svg>
